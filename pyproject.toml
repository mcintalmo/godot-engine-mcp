[project]
name = "godot-engine-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server and live Editor Bridge for Godot Engine 4.7+"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Godot MCP Authors" }
]
keywords = [
    "godot",
    "godot-engine",
    "mcp",
    "model-context-protocol",
    "ai",
    "game-development",
    "gdscript",
    "fastmcp",
    "claude",
    "cursor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Games/Entertainment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "typer>=0.27.1",
    "websockets>=17.0.1",
]

[project.urls]
Homepage = "https://github.com/mcintalmo/godot-engine-mcp"
Repository = "https://github.com/mcintalmo/godot-engine-mcp"
Issues = "https://github.com/mcintalmo/godot-engine-mcp/issues"

[project.scripts]
godot-engine-mcp = "godot_engine_mcp.cli:app"
godot-mcp = "godot_engine_mcp.cli:app"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
exclude = [
    ".agents",
    ".venv",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

