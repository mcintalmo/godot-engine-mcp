[project]
name = "godot-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "typer>=0.27.1",
    "websockets>=17.0.1",
]


[project.scripts]
godot-mcp = "godot_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[dependency-groups]
dev = [
    "notebook>=7.6.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
exclude = [
    ".agents",
    ".venv",
]

[tool.ty.src]
include = ["src", "tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"




